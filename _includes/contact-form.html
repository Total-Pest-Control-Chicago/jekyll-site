{% include call-notice.html %}
              <form action="https://formspree.io/f/xnpaooyj" method="post">
                <input type="hidden" name="_subject" value="New Total Pest Control contact form message">
                <div class="row gy-4">
                  <div class="col-md-6">
                    <label for="contact-name" class="visually-hidden">Your name</label>
                    <input type="text" id="contact-name" name="name" class="form-control" placeholder="Your Name" required="" autocomplete="name">
                  </div>
                  <div class="col-md-6">
                    <label for="contact-email" class="visually-hidden">Your email</label>
                    <input type="email" id="contact-email" name="email" class="form-control" placeholder="Your Email" required="" autocomplete="email">
                  </div>
                  <div class="col-12">
                    <label for="contact-phone" class="visually-hidden">Phone number</label>
                    <input type="tel" id="contact-phone" name="phone" class="form-control" placeholder="Phone Number" required="" autocomplete="tel">
                  </div>
                  <div class="col-12">
                    <label for="contact-message" class="visually-hidden">Message</label>
                    <textarea id="contact-message" name="message" class="form-control" rows="5" placeholder="Your Message" required=""></textarea>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn-submit">Send Message</button>
                  </div>
                </div>
              </form>
